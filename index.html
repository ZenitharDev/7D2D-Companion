<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' https://www.googletagmanager.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com;
        base-uri 'none';
        form-action 'none';
        object-src 'none'"
    />
    <title>7 Days to Die — Armor Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- GA4 loader. The dataLayer/gtag bootstrap itself lives in src/web/analytics.ts,
         bundled as part of the app's own script ('self') instead of an inline
         <script> here, so the CSP above doesn't need 'unsafe-inline' for scripts. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0BTTTT46L2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
